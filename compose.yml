services:
  open-data-17:
    image: timescale/timescaledb-ha:pg17-oss
    restart: unless-stopped
    shm_size: 32g
    command: postgres -c 'max_connections=6000' -c 'timescaledb.max_background_workers=32' -c 'timescaledb.telemetry_level=off'
    environment:
      - POSTGRES_USER=opendata
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=opendata
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./data/open-data-ha:/var/lib/postgresql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT}:5432"

  pgadmin:
    user: root
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PW}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./data/provisioning/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - open-data-17

  open-postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    ports:
      - "${POSTGREST_PORT}:3000"
    environment:
      PGRST_DB_URI: postgres://readonly:${READONLY_PW}@open-data-17:5432/${DB_NAME}
      PGRST_DB_PRE_CONFIG: postgrest.pre_config
      PGRST_DB_ANON_ROLE: readonly
      PGRST_DB_AGGREGATES_ENABLED: True
    depends_on:
      - open-data-17

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB}
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prefect" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_REDIS_MESSAGING_PASSWORD: ${PREFECT_REDIS_MESSAGING_PASSWORD}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "${PREFECT_PORT}:4200"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  prefect-services:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_REDIS_MESSAGING_PASSWORD: ${PREFECT_REDIS_MESSAGING_PASSWORD}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_REDIS_MESSAGING_DB: 0
      PREFECT_SERVER_API_AUTH_STRING: "${PREFECT_USER}:${PREFECT_PASSWORD}"
    command: prefect server services start

  prefect-worker:
    image: prefecthq/prefect:3-latest
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      ENTSOE_API_KEY: ${ENTSOE_API_KEY}
      PREFECT_LOGGING_EXTRA_LOGGERS: exchange_analysis
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

    command: prefect worker start --pool local-pool

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    hostname: metabase
    volumes:
      - ./data/metabase:/metabase-data
    ports:
      - "${METABASE_PORT}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`${METABASE_DOMAIN}`)"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls=true"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${POSTGRES_METABASE_PW}
      MB_DB_HOST: postgres-metabase
      JAVA_OPTS: "-Xms1g -Xmx2g"
      MB_SAMPLE_DATABASE: "false"
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres-metabase
    networks:
      - default
      - proxy

  co2map:
    build:
      context: ./co2map
      dockerfile: Dockerfile
    container_name: oeds-co2map
    restart: unless-stopped
    depends_on:
      - open-data-17
    volumes:
      - ./co2map:/app
      # Weather cutouts (NetCDF) -- (2026-08-24): kept
      # as files rather than migrated into Postgres, since the format is
      # already built for this. Path TBD, still needs the colleague to
      # confirm/create a real directory on the server; ./data/co2map-cutouts
      # here is a placeholder following this repo's own convention for
      # persistent host paths (see ./data/open-data-ha, ./data/pgadmin
      # above). Mounted read-only: this service only reads these, the
      # (separate, external) upload process writes them.
      # Mounted straight to /app/inputs/cutouts to match
      # cosema/generation/vre.py's existing `./inputs/cutouts/{month}` path
      # unchanged -- no code change needed on our side for this mount.
      - ./data/co2map-cutouts:/app/inputs/cutouts:ro
      # NOTE: cosema/pypsa_scripts.py's reference network files
      # (inputs/networks/*.nc, consumption-side flow tracing) are NOT covered
      # yet -- that whole code path is still "zurückgestellt" per
      # modularization_docs/modularisierung_status.md, unrelated to this
      # session's OEDS-integration work.
    environment:
      # DB_HOST confirmed by the server colleague (2026-08-26): open-data-17,
      # its own service name -- containers address each other by service name
      # inside the compose network.
      DB_HOST: ${DB_HOST}
      # NOT ${DB_PORT} (that's 7432, the port open-data-17 is mapped to on
      # the HOST for external access, e.g. from a laptop -- see
      # `ports: "${DB_PORT}:5432"` on open-data-17 above). From inside the
      # compose network, Postgres is reachable directly on its own container
      # port, 5432, regardless of what DB_PORT is set to externally. Hardcoded
      # (not a variable) since it's an internal-network constant, not
      # server-specific config.
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Same var prefect-worker already uses above -- replaces co2map's old
      # keys.yaml file (never set up for this container; removed 2026-08-28).
      ENTSOE_API_KEY: ${ENTSOE_API_KEY}
      LOG_LEVEL: INFO

  postgres-metabase:
    image: postgres:16
    restart: unless-stopped
    hostname: postgres
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: ${POSTGRES_METABASE_PW}
volumes:
  prefect_postgres_data:
  metabase_postgres_data:
  redis_data:

networks:
  proxy:
    external: true
    name: proxy
